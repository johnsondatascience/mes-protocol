[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesproto"
version = "0.1.0"
description = "Research harness for a pre-registered study of intraday MES order-flow setups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
databento = ["databento>=0.34"]
dev = ["pytest>=7.4"]

[project.scripts]
mesproto-evaluate = "mesproto.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
